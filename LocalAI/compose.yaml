services:
  Local-AIModel:
    image: ${LOCALAI_IMAGE:-docker.io/localai/localai:v4.11.0-gpu-nvidia-cuda-12}
    container_name: Local-AIModel
    environment:
      MODELS_PATH: /models
      PRELOAD_MODELS_CONFIG: ${LOCALAI_PRELOAD_MODELS_CONFIG:-/configuration/preload-models.yaml}
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      DEBUG: ${LOCALAI_DEBUG:-false}
    volumes:
      - type: volume
        source: local-ai-models
        target: /models
      - type: bind
        source: ./LocalAI/preload-models.yaml
        target: /configuration/preload-models.yaml
        read_only: true
      - type: bind
        source: ./LocalAI/preload-gemma4-e4b.yaml
        target: /configuration/preload-gemma4-e4b.yaml
        read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    gpus: all
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30m

  mainflow:
    environment:
      LOCAL_LLM_BASE_URL: http://Local-AIModel:8080/v1
      LOCAL_LLM_MODEL: ${LOCALAI_DEFAULT_MODEL:-gemma4-e2b-q4}
    depends_on:
      Local-AIModel:
        condition: service_healthy

volumes:
  local-ai-models:
    name: idle-capstone-local-ai-models
