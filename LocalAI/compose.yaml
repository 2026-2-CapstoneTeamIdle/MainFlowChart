services:
  Local-AIBackendSetup:
    image: ${LOCALAI_IMAGE:-docker.io/localai/localai:v4.11.0-gpu-nvidia-cuda-12}
    entrypoint: ["/bin/sh"]
    # Windows checkouts may expose this bind-mounted script with CRLF line endings.
    # Normalize it in-memory before execution so /bin/sh never parses `set -eu\r`.
    command: ["-c", "tr -d '\\r' < /setup/setup-runtime.sh | /bin/sh"]
    volumes:
      - type: volume
        source: local-ai-backends
        target: /backends
      - type: volume
        source: local-ai-configuration
        target: /configuration
      - type: bind
        source: ./LocalAI/sd-turbo.yaml
        target: /seed/sd-turbo.yaml
        read_only: true
      - type: bind
        source: ./LocalAI/setup-runtime.sh
        target: /setup/setup-runtime.sh
        read_only: true

  Local-AIModel:
    image: ${LOCALAI_IMAGE:-docker.io/localai/localai:v4.11.0-gpu-nvidia-cuda-12}
    container_name: Local-AIModel
    environment:
      MODELS_PATH: /models
      LOCALAI_MODELS_CONFIG_FILE: /configuration/sd-turbo.yaml
      PRELOAD_MODELS_CONFIG: ${LOCALAI_PRELOAD_MODELS_CONFIG:-/configuration/preload-qwen-coder.yaml}
      LOCALAI_MAX_ACTIVE_BACKENDS: "1"
      LOCALAI_SINGLE_ACTIVE_BACKEND: "true"
      LOCALAI_FORCE_BACKEND_SHUTDOWN: "true"
      LLAMACPP_PARALLEL: "1"
      PARALLEL_REQUEST: "false"
      LOCALAI_DISABLE_HARDWARE_DEFAULTS: "true"
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_TOKEN: ${HF_TOKEN:-}
      DEBUG: ${LOCALAI_DEBUG:-false}
    volumes:
      - type: volume
        source: local-ai-models
        target: /models
      - type: volume
        source: local-ai-backends
        target: /backends
      - type: volume
        source: local-ai-configuration
        target: /configuration
      - type: bind
        source: ./LocalAI/preload-models.yaml
        target: /configuration/preload-models.yaml
        read_only: true
      - type: bind
        source: ./LocalAI/preload-qwen-coder.yaml
        target: /configuration/preload-qwen-coder.yaml
        read_only: true
      - type: bind
        source: ./LocalAI/preload-gemma4-e4b.yaml
        target: /configuration/preload-gemma4-e4b.yaml
        read_only: true
      - type: bind
        source: ./LocalAI/preload-visual.yaml
        target: /configuration/preload-visual.yaml
        read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    gpus: all
    depends_on:
      Local-AIBackendSetup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30m

  mainflow:
    environment:
      LOCAL_LLM_BASE_URL: http://Local-AIModel:8080/v1
      LOCAL_LLM_MODEL: ${LOCALAI_DEFAULT_MODEL:-qwen2.5-coder-7b-q5-k-m}
      LOCAL_IMAGE_BASE_URL: http://Local-AIModel:8080/v1
      LOCAL_IMAGE_MODEL: ${LOCALAI_IMAGE_MODEL:-sd-turbo}
      MAINFLOW_FEATURE_PROVIDER: ${MAINFLOW_FEATURE_PROVIDER:-local}
      LOCAL_LLM_CONTEXT_TOKENS: ${LOCAL_LLM_CONTEXT_TOKENS:-16384}
      MAINFLOW_LOCAL_MAX_OUTPUT_TOKENS: ${MAINFLOW_LOCAL_MAX_OUTPUT_TOKENS:-8192}
      MAINFLOW_VISUAL_TARGET_AI: ${MAINFLOW_VISUAL_TARGET_AI:-sd_turbo}
      MAINFLOW_VISUAL_TARGET_SIZE: ${MAINFLOW_VISUAL_TARGET_SIZE:-512x288}
      MAINFLOW_VISUAL_TARGET_STEPS: ${MAINFLOW_VISUAL_TARGET_STEPS:-2}
      LLM_VISUAL_VALIDATION_PROVIDER: ${LLM_VISUAL_VALIDATION_PROVIDER:-local}
      LLM_VISUAL_VALIDATION_MODEL: ${LLM_VISUAL_VALIDATION_MODEL:-qwen3-vl-4b-instruct-q4-k-m}
      LLM_VISUAL_VALIDATION_MAX_TOKENS: ${LLM_VISUAL_VALIDATION_MAX_TOKENS:-768}
      LLM_VISUAL_VALIDATION_RESPONSE_ATTEMPTS: ${LLM_VISUAL_VALIDATION_RESPONSE_ATTEMPTS:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
    depends_on:
      Local-AIModel:
        condition: service_healthy

volumes:
  local-ai-models:
    name: idle-capstone-local-ai-models
  local-ai-backends:
    name: idle-capstone-local-ai-backends
  local-ai-configuration:
    name: idle-capstone-local-ai-configuration
