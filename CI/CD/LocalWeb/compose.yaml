name: main-flow-chart-local-web

services:
  local-web:
    init: true
    build:
      context: ../../..
      dockerfile: CI/CD/LocalWeb/Dockerfile
      args:
        CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.167.2}
        UNITY_EDITOR_IMAGE: ${UNITY_EDITOR_IMAGE:-unityci/editor:ubuntu-6000.0.71f1-webgl-3}
    image: main-flow-chart-local-web:local
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VASTAI_INFERENCE_API_KEY: ${VASTAI_INFERENCE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      LOCAL_IMAGE_BASE_URL: ${LOCAL_IMAGE_BASE_URL:-http://host.docker.internal:8080/v1}
      MAINFLOW_GEMINI_MODEL: ${MAINFLOW_GEMINI_MODEL:-gemini-3-flash-preview}
      MAINFLOW_GEMINI_TIMEOUT_SECONDS: ${MAINFLOW_GEMINI_TIMEOUT_SECONDS:-90}
      MAINFLOW_GEMINI_THINKING_LEVEL: ${MAINFLOW_GEMINI_THINKING_LEVEL:-low}
      MAINFLOW_GEMINI_MAX_OUTPUT_TOKENS: ${MAINFLOW_GEMINI_MAX_OUTPUT_TOKENS:-8192}
      MAINFLOW_WORKSPACE: /app/workspace
      MAINFLOW_CODEX_CLI_PATH: /usr/local/bin/codex
      # Docker is already the external sandbox. Codex's nested bubblewrap cannot create a
      # namespace under Docker Desktop's default security profile.
      MAINFLOW_CODEX_DOCKER_BYPASS_SANDBOX: "1"
      MAINFLOW_DOCKER_LOCALWEB: "1"
      MAINFLOW_HOST_WORKSPACE: ${MAINFLOW_HOST_WORKSPACE:-}
      CODEX_HOME: /home/mainflow/.codex
      UNITY_EDITOR_PATH: /opt/unity/Editor/Unity
      UNITY_CLI_HOME: /opt/unity-cli
      UNITY_NO_CONSENT_PROMPT: "1"
      DISPLAY: :99
      HOME: /home/mainflow
      PYTHONUNBUFFERED: "1"
    shm_size: "2gb"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ../../../workspace
        target: /app/workspace
      - type: volume
        source: codex-auth
        target: /home/mainflow/.codex
      - type: volume
        source: unity-license
        target: /home/mainflow/.local/share/unity3d
      - type: volume
        source: unity-config
        target: /home/mainflow/.config
      - type: volume
        source: unity-cache
        target: /home/mainflow/.cache/unity3d

volumes:
  codex-auth:
    name: main-flow-chart-codex-auth
  unity-license:
    name: main-flow-chart-unity-license
  unity-config:
    name: main-flow-chart-unity-config
  unity-cache:
    name: main-flow-chart-unity-cache
