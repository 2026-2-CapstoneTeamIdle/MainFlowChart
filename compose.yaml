name: main-flow-chart

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    environment:
      MAINFLOW_WORKSPACE: /app/workspace
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MCP_ALLOWED_HOSTS: "mcp-server,mcp-server:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./workspace
        target: /app/workspace
    ports:
      - "127.0.0.1:8001:8001"
    command:
      - /app/.venv/bin/python
      - -m
      - MCP.server
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "MCP.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mainflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    environment:
      MAINFLOW_WORKSPACE: /app/workspace
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      PYTHONUNBUFFERED: "1"
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./workspace
        target: /app/workspace
    command:
      - /app/.venv/bin/python
      - -m
      - mainflow.run_flow
      - --image-style
      - Pixel Art
      - --genre
      - 플랫포머
      - --mood-style
      - Fantasy
      - --viewpoint
      - 사이드뷰
      - --condition
      - 공격과 8방향 이동이 가능한 게임

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    profiles: ["test"]
    command:
      - /app/.venv/bin/python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
