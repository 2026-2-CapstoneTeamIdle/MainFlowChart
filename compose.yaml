name: main-flow-chart

services:
  mainflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    environment:
      MAINFLOW_WORKSPACE: /app/workspace
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./workspace
        target: /app/workspace
    command:
      - /app/.venv/bin/python
      - -m
      - mainflow.run_flow
      - --image-style
      - Pixel Art
      - --genre
      - 플랫포머
      - --mood-style
      - Fantasy
      - --viewpoint
      - 사이드뷰
      - --condition
      - 공격과 8방향 이동이 가능한 게임

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    profiles: ["test"]
    command:
      - /app/.venv/bin/python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
