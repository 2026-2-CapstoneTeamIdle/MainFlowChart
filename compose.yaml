name: main-flow-chart

services:
  mainflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    environment:
      MAINFLOW_WORKSPACE: /app/workspace
      PYTHONUNBUFFERED: "1"
      # placeholder (default) | openai. Keys come from the host shell or .env.
      MAINFLOW_IMAGE_BACKEND: ${MAINFLOW_IMAGE_BACKEND:-placeholder}
      MAINFLOW_OPENAI_IMAGE_MODEL: ${MAINFLOW_OPENAI_IMAGE_MODEL:-gpt-image-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - type: bind
        source: ./workspace
        target: /app/workspace
    command:
      - /app/.venv/bin/python
      - run_flow.py
      - --image-style
      - Pixel Art
      - --genre
      - Action
      - --quality
      - Medium

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    profiles: ["test"]
    command:
      - /app/.venv/bin/python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
