name: main-flow-chart

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    environment:
      MAINFLOW_WORKSPACE: /app/workspace
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      MCP_ALLOWED_HOSTS: "mcp-server,mcp-server:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./workspace
        target: /app/workspace
    ports:
      - "127.0.0.1:8001:8001"
    command:
      - /app/.venv/bin/python
      - -m
      - MCP.server
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-m", "MCP.healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mainflow:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SOUND_PROVIDER: ${SOUND_PROVIDER:-auto}
      SOUND_FALLBACK: ${SOUND_FALLBACK:-procedural}
      SOUND_BGM_SECONDS: ${SOUND_BGM_SECONDS:-30}
      ELEVENLABS_OUTPUT_FORMAT: ${ELEVENLABS_OUTPUT_FORMAT:-pcm_44100}
      ELEVENLABS_SFX_MODEL: ${ELEVENLABS_SFX_MODEL:-}
      ELEVENLABS_MUSIC_MODEL: ${ELEVENLABS_MUSIC_MODEL:-}
      MAINFLOW_FEATURE_PROVIDER: ${MAINFLOW_FEATURE_PROVIDER:-local}
      MAINFLOW_DESIGN_V2_PROVIDER: ${MAINFLOW_DESIGN_V2_PROVIDER:-local}
      MAINFLOW_BLUEPRINT_PROVIDER: ${MAINFLOW_BLUEPRINT_PROVIDER:-deterministic}
      LOCAL_LLM_CONTEXT_TOKENS: ${LOCAL_LLM_CONTEXT_TOKENS:-16384}
      MAINFLOW_LOCAL_MAX_OUTPUT_TOKENS: ${MAINFLOW_LOCAL_MAX_OUTPUT_TOKENS:-8192}
      MAINFLOW_GEMINI_MODEL: ${MAINFLOW_GEMINI_MODEL:-gemini-3-flash-preview}
      MAINFLOW_GEMINI_TIMEOUT_SECONDS: ${MAINFLOW_GEMINI_TIMEOUT_SECONDS:-90}
      MAINFLOW_IMAGE_BACKEND: ${MAINFLOW_IMAGE_BACKEND:-placeholder}
      MAINFLOW_IMAGE_SPRITE_SHEETS: ${MAINFLOW_IMAGE_SPRITE_SHEETS:-on}
      MAINFLOW_IMAGE_SPRITE_SHEET_MODE: ${MAINFLOW_IMAGE_SPRITE_SHEET_MODE:-auto}
      MAINFLOW_OPENAI_IMAGE_MODEL: ${MAINFLOW_OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      MAINFLOW_OPENAI_IMAGE_QUALITY: ${MAINFLOW_OPENAI_IMAGE_QUALITY:-medium}
      MAINFLOW_LOCAL_IMAGE_MODEL: ${MAINFLOW_LOCAL_IMAGE_MODEL:-}
      MAINFLOW_LOCAL_IMAGE_BASE_URL: ${MAINFLOW_LOCAL_IMAGE_BASE_URL:-}
      MAINFLOW_LOCAL_IMAGE_SIZE: ${MAINFLOW_LOCAL_IMAGE_SIZE:-512x512}
      MAINFLOW_LOCAL_IMAGE_STEPS: ${MAINFLOW_LOCAL_IMAGE_STEPS:-}
      MAINFLOW_LOCAL_IMAGE_TIMEOUT_SECONDS: ${MAINFLOW_LOCAL_IMAGE_TIMEOUT_SECONDS:-600}
      MAINFLOW_GEMINI_THINKING_LEVEL: ${MAINFLOW_GEMINI_THINKING_LEVEL:-low}
      MAINFLOW_GEMINI_MAX_OUTPUT_TOKENS: ${MAINFLOW_GEMINI_MAX_OUTPUT_TOKENS:-8192}
      MAINFLOW_WORKSPACE: /app/workspace
      MCP_SERVER_URL: http://mcp-server:8001/mcp
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5-coder-7b-q5-k-m}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:8080/v1}
      VASTAI_INFERENCE_API_KEY: ${VASTAI_INFERENCE_API_KEY:-}
      VASTAI_INFERENCE_TIMEOUT_SECONDS: ${VASTAI_INFERENCE_TIMEOUT_SECONDS:-600}
      VASTAI_CODER_BASE_URL: ${VASTAI_CODER_BASE_URL:-http://host.docker.internal:18000/v1}
      VASTAI_CODER_MODEL: ${VASTAI_CODER_MODEL:-mainflow-coder}
      VASTAI_CODER_CONTEXT_TOKENS: ${VASTAI_CODER_CONTEXT_TOKENS:-32768}
      VASTAI_CODER_MAX_OUTPUT_TOKENS: ${VASTAI_CODER_MAX_OUTPUT_TOKENS:-8192}
      VASTAI_VLM_BASE_URL: ${VASTAI_VLM_BASE_URL:-http://host.docker.internal:18001/v1}
      VASTAI_VLM_MODEL: ${VASTAI_VLM_MODEL:-mainflow-vlm}
      VASTAI_IMAGE_BASE_URL: ${VASTAI_IMAGE_BASE_URL:-http://host.docker.internal:18002/v1}
      VASTAI_IMAGE_MODEL: ${VASTAI_IMAGE_MODEL:-mainflow-image}
      LLM_VISUAL_VALIDATION_PROVIDER: ${LLM_VISUAL_VALIDATION_PROVIDER:-local}
      LLM_VISUAL_VALIDATION_RESPONSE_ATTEMPTS: ${LLM_VISUAL_VALIDATION_RESPONSE_ATTEMPTS:-2}
      MAINFLOW_VISUAL_TARGET_AI: ${MAINFLOW_VISUAL_TARGET_AI:-sd_turbo}
      PYTHONUNBUFFERED: "1"
    depends_on:
      mcp-server:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./workspace
        target: /app/workspace
    command:
      - /app/.venv/bin/python
      - -m
      - mainflow.run_flow
      - --image-style
      - Pixel Art
      - --genre
      - 플랫포머
      - --mood-style
      - Fantasy
      - --viewpoint
      - 사이드뷰
      - --condition
      - 공격과 8방향 이동이 가능한 게임

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: main-flow-chart:local
    profiles: ["test"]
    command:
      - /app/.venv/bin/python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
